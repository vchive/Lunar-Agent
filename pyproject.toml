[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-agent"
version = "0.1.0"
description = "A standalone, local-first Hermes-inspired agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "vchive" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
lint = [
  "ruff>=0.6",
]

[project.scripts]
famou = "famou.cli:main"
lunar-agent = "famou.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
